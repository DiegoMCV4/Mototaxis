name: Deploy Backend — Dual EC2 Architecture

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'docker-compose.*.yml'
      - 'nginx/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-to-aws:
    name: 🚀 Deploy a Doble Instancia EC2
    runs-on: ubuntu-latest
    if: ${{ secrets.EC2_SSH_KEY != '' }}

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      # ─── DESPLIEGUE EN MÁQUINA 2 (MICROSERVICIOS) ───
      - name: 🧠 Deploy Microservicios (Instancia 2)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Mototaxis || git clone https://github.com/DiegoMCV4/Mototaxis.git
            cd Mototaxis
            git pull origin main
            sudo docker-compose -f docker-compose.microservices.yml up -d --build
            sudo docker image prune -f

      # ─── DESPLIEGUE EN MÁQUINA 1 (GATEWAY & NGINX) ───
      - name: 🚪 Deploy Gateway (Instancia 1)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Mototaxis || git clone https://github.com/DiegoMCV4/Mototaxis.git
            cd Mototaxis
            git pull origin main
            sudo docker-compose -f docker-compose.gateway.yml up -d --build
            sudo docker image prune -f
