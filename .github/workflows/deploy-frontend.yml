name: Deploy Frontend — Vercel (Landing)

on:
  push:
    branches: [ main ]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  # ============================================================
  # JOB: Landing Page → Vercel
  # ============================================================
  deploy-landing-vercel:
    name: 🌐 Deploy Landing Page → Vercel
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: 📦 Instalar dependencias — Landing
        run: npm install
        working-directory: landing

      - name: 🏗️ Build Landing Page
        run: npm install && npm run build
        working-directory: landing
        env:
          VITE_APP_URL: https://landing-psi-blond.vercel.app
          VITE_PLAY_STORE_URL: ${{ secrets.PLAY_STORE_URL || '#' }}

      - name: 🚀 Deploy a Vercel
        run: npx vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope diegomcv4s-projects
        working-directory: landing
