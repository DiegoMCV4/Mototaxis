name: CI — Integración Continua MotoTaxi

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================
  # JOB 1: Lint y validación de código
  # ============================================================
  lint:
    name: 🔍 Lint del Código
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api-gateway, auth-service, rides-service, ratings-service, tracking-service, payments-service]

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: 📦 Instalar dependencias — ${{ matrix.service }}
        run: npm install
        working-directory: services/${{ matrix.service }}

  # ============================================================
  # JOB 2: Health checks de microservicios con Docker Compose
  # ============================================================
  health-check:
    name: 🏥 Health Check de Microservicios
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Levantar servicios con Docker Compose
        run: docker compose up --build -d
        timeout-minutes: 10

      - name: ⏳ Esperar que los servicios estén listos
        run: |
          echo "Esperando servicios..."
          sleep 30

      - name: 🔀 Verificar API Gateway /health
        run: |
          curl -f http://localhost:3000/health | jq .
          echo "✅ API Gateway OK"

      - name: 🔐 Verificar Auth Service /health
        run: |
          curl -f http://localhost:3001/health | jq .
          echo "✅ Auth Service OK"

      - name: 🚗 Verificar Rides Service /health
        run: |
          curl -f http://localhost:3002/health | jq .
          echo "✅ Rides Service OK"

      - name: ⭐ Verificar Ratings Service /health
        run: |
          curl -f http://localhost:3003/health | jq .
          echo "✅ Ratings Service OK"

      - name: 📍 Verificar Tracking Service /health
        run: |
          curl -f http://localhost:3004/health | jq .
          echo "✅ Tracking Service OK"

      - name: 💳 Verificar Payments Service /health
        run: |
          curl -f http://localhost:3005/health | jq .
          echo "✅ Payments Service OK"

      - name: 🛑 Detener servicios
        if: always()
        run: docker compose down -v

  # ============================================================
  # JOB 3: Build del frontend
  # ============================================================
  frontend-build:
    name: 🌐 Build Frontend React+Vite
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias frontend
        run: npm install
        working-directory: frontend

      - name: 🏗️ Build producción
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}

      - name: 📤 Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
