# =============================================
# MotoTaxi — Nginx Reverse Proxy con HTTPS
# Dominio: mrt.viewdns.net (No-IP)
# Certbot (Let's Encrypt) para SSL
# =============================================

# ── Rate limiting global ──────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ── Redirección HTTP → HTTPS ──────────────────
server {
    listen 80;
    server_name mrt.viewdns.net;

    # Ruta especial para Certbot (renovación de certificados)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Servidor HTTPS principal ──────────────────
server {
    listen 443 ssl http2;
    server_name mrt.viewdns.net;

    # ── Certificados SSL (Let's Encrypt / Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/mrt.viewdns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrt.viewdns.net/privkey.pem;

    # ── Parámetros SSL modernos ──────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;

    # ── Headers de seguridad ─────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "geolocation=(self)"                          always;

    # ── Compresión Gzip ──────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Proxy al API Gateway (todos los /api/*) ──────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Rate limit extra en auth (evitar brute force) ──
    location /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.io para tracking GPS) ──────
    location /socket.io/ {
        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Swagger/Docs del API Gateway ─────────────────
    location /docs {
        proxy_pass         http://api-gateway:3000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Frontend App (React, servido desde S3/local) ──
    location / {
        # En producción: proxy a CloudFront o S3
        # En local: archivos estáticos
        root   /var/www/html/app;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Health check público de Nginx ─────────────────
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","domain":"mrt.viewdns.net"}';
        add_header Content-Type application/json;
    }
}
